# Runner prerequisites: Python 3, CMake, Ninja, a host C compiler,
# arm-none-eabi toolchain and qemu-system-arm.
stages:
  - test
  - build

host-regressions:
  stage: test
  script:
    - python3 scripts/check_layer_deps.py
    - python3 tests/run_host_regressions.py
    - python3 -m unittest discover -s tests -p 'test_*.py'
    - cmake -P tests/test_arch_flags.cmake
    - cmake -P tests/test_soc_headers.cmake

board-builds:
  stage: build
  script:
    - cmake --preset qemu-stm32
    - cmake --build --preset qemu-stm32
    - python3 tests/qemu_stm32_smoke.py build/qemu-stm32/nos.elf
    - cmake --preset qemu-stm32 -B build/qemu-vfs-concurrency -DNOS_CONFIG_FRAGMENTS=configs/fragments/vfs-fd-concurrency.conf
    - cmake --build build/qemu-vfs-concurrency
    - python3 tests/qemu_vfs_concurrency.py build/qemu-vfs-concurrency/nos.elf
    - cmake --preset nk60-v2
    - cmake --build --preset nk60-v2
    - cmake --preset zj-v3
    - cmake --build --preset zj-v3
    - cmake --preset wl-001
    - cmake --build --preset wl-001
